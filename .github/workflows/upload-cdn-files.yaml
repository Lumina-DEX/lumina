name: Upload CDN Files

on:
  workflow_dispatch:
    inputs:
      contracts_version:
        description: "Contracts version path to rebuild and upload (defaults to packages/contracts/package.json version)"
        required: false
        type: string
      deploy_worker:
        description: "Also deploy the CDN worker after uploading assets"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      contracts_version:
        required: false
        type: string
      deploy_worker:
        required: false
        default: false
        type: boolean

concurrency: wc-${{ github.workflow }}-${{ github.ref }}
permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  deployments: write

jobs:
  upload-cdn:
    name: Upload CDN Files
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Moon toolchain
        uses: "moonrepo/setup-toolchain@v0"
        with:
          moon-version: "1.40.3"

      - name: Verify R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CDN_CACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CDN_CACHE_SECRET_ACCESS_KEY }}
          R2_BUCKET_CACHE: ${{ secrets.R2_CDN_CACHE_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        working-directory: packages/contracts-cdn
        run: |
          cat > rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          EOF

          rclone lsf "r2:${R2_BUCKET_CACHE}" --config ./rclone.conf --max-depth 1 > /dev/null && echo "✓ R2 connection successful" || exit 1

      - name: 🗂️ Build contracts-cdn cache
        env:
          CONTRACTS_VERSION_OVERRIDE: ${{ inputs.contracts_version }}
        run: moon contracts-cdn:build-cache

      - name: ☁️ Upload CDN assets to Cloudflare R2
        env:
          R2_BUCKET_CACHE: ${{ secrets.R2_CDN_CACHE_BUCKET }}
          CONTRACTS_VERSION_OVERRIDE: ${{ inputs.contracts_version }}
        working-directory: packages/contracts-cdn
        run: |
          version="$(printf '%s' "${CONTRACTS_VERSION_OVERRIDE:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          version="${version:-$(jq '.version' ../contracts/package.json -r)}"

          echo "Uploading contract-cache version v${version} to R2 bucket ${R2_BUCKET_CACHE}..."

          for network in mina:devnet mina:mainnet; do
            source_dir="tmp/contract-cache/${network}/v${version}"
            manifest_path="${source_dir}/manifest.json"

            if [ ! -f "${manifest_path}" ]; then
              echo "Expected manifest not found: ${manifest_path}"
              exit 1
            fi

            echo "Uploading ${source_dir} to contract-cache/${network}/v${version}..."

            rclone copy "${source_dir}" "r2:${R2_BUCKET_CACHE}/contract-cache/${network}/v${version}" \
              --config ./rclone.conf \
              --checksum \
              --fast-list \
              --transfers 16 \
              --checkers 32 \
              --exclude "/temp_diff/**"
          done

  deploy-cdn:
    name: Deploy CDN Worker
    needs: [upload-cdn]
    if: ${{ inputs.deploy_worker == true }}
    uses: ./.github/workflows/cdn.yaml
    secrets: inherit
