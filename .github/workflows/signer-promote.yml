name: Signer Promote

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Production signer environment"
        required: true
        type: choice
        options:
          - mina-mainnet
          - zeko-mainnet
      image_digest:
        description: "Image digest or immutable image reference"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: signer-promote-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote signer image
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env == 'mina-mainnet' && 'signer-mina-mainnet' || 'signer-zeko-mainnet' }}
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      TARGET_HOSTNAME: ${{ secrets.TARGET_HOSTNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SIGNER_API_KEY: ${{ secrets.SIGNER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve git SHA from image label
        id: meta
        run: |
          image_input="${{ inputs.image_digest }}"
          case "$image_input" in
            ghcr.io/lumina-dex/lumina-signer@sha256:*)
              image_ref="$image_input"
              ;;
            sha256:*)
              image_ref="ghcr.io/lumina-dex/lumina-signer@$image_input"
              ;;
            *)
              image_ref="ghcr.io/lumina-dex/lumina-signer@sha256:$image_input"
              ;;
          esac

          docker pull "$image_ref"
          git_sha="$(docker inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [ -n "$git_sha" ] || { echo "Unable to resolve org.opencontainers.image.revision for $image_ref" >&2; exit 1; }

          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy approved digest
        run: |
          packages/signer/scripts/ops/deploy-image-over-ssh.sh \
            --target "${TARGET_ENV}" \
            --image-digest "${{ inputs.image_digest }}" \
            --git-sha "${{ steps.meta.outputs.git_sha }}"

      - name: Run remote signer audit
        run: |
          packages/signer/scripts/ops/audit-signer-fleet.sh \
            --remote-only \
            --target "${TARGET_ENV}"
