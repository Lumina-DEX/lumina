name: Signer Promote

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Production signer environment"
        required: true
        type: choice
        options:
          - mina-mainnet
          - zeko-mainnet

permissions:
  contents: read

concurrency:
  group: signer-promote-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  promote:
    name: Rebuild production smoke host
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env == 'mina-mainnet' && 'signer-mina-mainnet' || 'signer-zeko-mainnet' }}
    env:
      TARGET_HOSTNAME: ${{ secrets.TARGET_HOSTNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      LEGACY_SIGNER_BLOCKLIST: ${{ secrets.LEGACY_SIGNER_BLOCKLIST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Rebuild NixOS smoke host
        run: |
          packages/signer/infra/scripts/rebuild-smoke-host.sh \
            --target "${{ inputs.target_env }}"

      - name: Check HTTPS smoke path
        run: |
          packages/signer/infra/scripts/check-smoke-host.sh \
            --target "${{ inputs.target_env }}"
