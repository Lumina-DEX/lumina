name: Signer Deploy Testnet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signer-zeko-testnet
  cancel-in-progress: false

jobs:
  deploy:
    name: Rebuild zeko testnet smoke host
    runs-on: ubuntu-latest
    environment: signer-zeko-testnet
    env:
      TARGET_HOSTNAME: ${{ secrets.TARGET_HOSTNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      LEGACY_SIGNER_BLOCKLIST: ${{ secrets.LEGACY_SIGNER_BLOCKLIST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Rebuild NixOS smoke host
        run: |
          packages/signer/infra/scripts/rebuild-smoke-host.sh \
            --target zeko-testnet

      - name: Check HTTPS smoke path
        run: |
          packages/signer/infra/scripts/check-smoke-host.sh \
            --target zeko-testnet
