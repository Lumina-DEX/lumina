pre-commit:
  parallel: true
  jobs:
    - name: format
      run: npx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    - name: lint
      run: npx biome check --formatter-enabled=false --no-errors-on-unmatched {staged_files}
    - name: typecheck-signer
      glob: "packages/signer/**/*.{ts,tsx}"
      root: "packages/signer/"
      run: npx tsc --noEmit
    - name: typecheck-sdk
      glob: "packages/sdk/**/*.{ts,tsx}"
      root: "packages/sdk/"
      run: npx tsc --noEmit
    - name: typecheck-dex-ui
      glob: "packages/dex-ui/**/*.{ts,tsx}"
      root: "packages/dex-ui/"
      run: npx tsc --noEmit
